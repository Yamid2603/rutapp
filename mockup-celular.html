<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RutaApp - Cuentas Mejorado</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #FAFAFA; }

    .header {
      background: white;
      padding: 20px;
      border-bottom: 1px solid #E5E5E5;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-title {
      font-size: 28px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 12px;
    }

    .header-filters {
      display: flex;
      gap: 8px;
    }

    .filter-btn {
      padding: 6px 14px;
      border: 1px solid #E5E5E5;
      background: white;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      color: #666;
      font-weight: 500;
    }

    .filter-btn.active {
      background: #0D2433;
      color: white;
      border-color: #0D2433;
    }

    .content { padding: 16px; }

    .stat-card {
      background: white;
      border: 1px solid #E5E5E5;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 12px;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: #1a1a1a;
    }

    .stat-value.red { color: #C53030; }
    .stat-value.teal { color: #0D8B96; }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: #1a1a1a;
      margin: 20px 0 12px 0;
      padding: 0 4px;
    }

    .card {
      background: white;
      border: 1px solid #E5E5E5;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      color: #999;
      font-size: 14px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .grid-2 .stat-card {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-title">Cuentas</div>
    <div class="header-filters">
      <button class="filter-btn active">Hoy</button>
      <button class="filter-btn">Esta semana</button>
      <button class="filter-btn">Este mes</button>
    </div>
  </div>

  <div class="content">
    <!-- Stats Grid 2x2 -->
    <div class="grid-2">
      <div class="stat-card">
        <div class="stat-label">Total ventas</div>
        <div class="stat-value">$0</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Cuentas por cobrar</div>
        <div class="stat-value red">$490K</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Camiones activos</div>
        <div class="stat-value">0</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Paradas completadas</div>
        <div class="stat-value">0/0</div>
      </div>
    </div>

    <!-- Map Section -->
    <div class="section-title">Camiones activos en mapa</div>
    <div class="card">
      ⚠️ Google Maps no configurada
    </div>

    <!-- Today Section -->
    <div class="section-title">Camiones activos hoy</div>
    <div class="card">
      No hay camiones activos hoy
    </div>
  </div>
</body>
</html>
